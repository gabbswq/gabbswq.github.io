<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabriel</title>
  <meta name="description" content="Gabriel · Brazil." />

  <meta property="og:title" content="Gabriel" />
  <meta property="og:description" content="Brazil." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://gabbswq.github.io" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0a0a;
      --border: #222;
      --border-strong: #2e2e2e;
      --text: #ededed;
      --text-soft: #888;
      --text-muted: #555;
      --accent: #f7931a;
      --radius: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    a { color: var(--text); text-decoration: none; transition: color 0.15s; }
    a:hover { color: var(--accent); }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      max-width: 1120px;
      width: 100%;
      align-items: center;
    }
    @media (min-width: 768px) {
      .layout {
        grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.9fr);
        gap: 4.5rem;
      }
    }

    /* ===== Photo ===== */
    .photo-col { width: 100%; }
    .photo {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
    }

    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 70% 35%, transparent 0%, rgba(0,0,0,0.18) 48%, rgba(0,0,0,0.45) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.04), rgba(0,0,0,0.26));
      pointer-events: none;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 56% center;
      border-radius: var(--radius);
      display: block;
      filter: brightness(0.88) contrast(1.06);
    }
    .photo .initials {
      font-family: 'Manrope', sans-serif;
      font-size: 7rem;
      font-weight: 700;
      color: var(--accent);
      opacity: 0.35;
      letter-spacing: -0.05em;
    }

    /* ===== Right column ===== */
    .content-col {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

.greeting {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      font-weight: 800;
      font-size: 2.75rem;
      line-height: 1.05;
      color: var(--text);
      letter-spacing: -0.045em;
      margin-bottom: -0.5rem;
    }

    .subtitle {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      font-weight: 500;
      font-size: 1.25rem;
      color: var(--text-soft);
      letter-spacing: -0.02em;
    }

    /* Inline social links */
    .links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      font-size: 0.95rem;
      padding-top: 1.25rem;
      padding-bottom: 1.25rem;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .links a {
      color: var(--text);
      transition: color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .links a:hover { color: var(--accent); }
.links a .platform-icon {
      font-size: 0.95rem;
      opacity: 0.7;
    }

    /* Form */
    .signup form {
      display: flex;
      gap: 0.5rem;
    }
    .signup input[type="email"] {
      flex: 1;
      padding: 0.85rem 1rem;
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .signup input[type="email"]:focus { border-color: var(--accent); }
    .signup button {
      width: 48px;
      height: 48px;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .signup button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }
    .signup .note {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.6rem;
    }

    footer {
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    footer a { color: var(--text-muted); text-decoration: underline; text-decoration-color: var(--text-muted); }
    footer a:hover { color: var(--accent); text-decoration-color: var(--accent); }

    .footer-contact {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .footer-contact span {
      color: var(--text-muted);
    }

    /* ===== Premium interactions ===== */
    .photo {
      transition:
        transform 0.45s cubic-bezier(.2,.8,.2,1),
        box-shadow 0.45s cubic-bezier(.2,.8,.2,1),
        border-color 0.45s cubic-bezier(.2,.8,.2,1);
      will-change: transform;
    }

    .photo:hover {
      transform: translateY(-8px) scale(1.012);
      border-color: rgba(247, 147, 26, 0.28);
      box-shadow:
        0 34px 110px rgba(0, 0, 0, 0.72),
        0 0 0 1px rgba(247, 147, 26, 0.08),
        0 0 42px rgba(247, 147, 26, 0.08);
    }

    .photo img {
      transition:
        transform 0.6s cubic-bezier(.2,.8,.2,1),
        filter 0.45s cubic-bezier(.2,.8,.2,1);
      will-change: transform, filter;
    }

    .photo:hover img {
      transform: scale(1.035);
      filter: brightness(0.98) contrast(1.12);
    }

    .links {
      gap: 0.75rem;
    }

    .links a {
      position: relative;
      padding: 0.55rem 0.75rem;
      border: 1px solid transparent;
      border-radius: 999px;
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
    }

    .links a:hover {
      color: var(--text);
      transform: translateY(-2px);
      border-color: rgba(247, 147, 26, 0.32);
      background: rgba(247, 147, 26, 0.075);
    }

    .links a:hover .social-icon {
      color: var(--accent);
      transform: scale(1.08) rotate(-3deg);
    }

    .social-icon {
      width: 1rem;
      height: 1rem;
      display: block;
      color: var(--text);
      fill: currentColor;
      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .signup input[type="email"] {
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .signup input[type="email"]:hover {
      border-color: rgba(247, 147, 26, 0.35);
      background: rgba(255, 255, 255, 0.015);
    }

    .signup input[type="email"]:focus {
      border-color: rgba(247, 147, 26, 0.85);
      box-shadow:
        0 0 0 4px rgba(247, 147, 26, 0.08),
        0 0 28px rgba(247, 147, 26, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }

    .signup button {
      position: relative;
      overflow: hidden;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
    }

    .signup button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(247, 147, 26, 0.18);
    }

    .footer-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--text-muted);
      text-decoration: none;
      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .footer-whatsapp svg {
      width: 0.95rem;
      height: 0.95rem;
      fill: currentColor;
      opacity: 0.85;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .footer-whatsapp:hover {
      color: var(--accent);
      transform: translateY(-1px);
    }

    .footer-whatsapp:hover svg {
      opacity: 1;
      transform: scale(1.12) rotate(6deg);
    }

    @media (prefers-reduced-motion: reduce) {
      .photo,
      .photo img,
      .links a,
      .social-icon,
      .signup input[type="email"],
      .signup button,
      .footer-whatsapp,
      .footer-whatsapp svg {
        transition: none;
      }

      .photo:hover,
      .photo:hover img,
      .links a:hover,
      .signup button:hover,
      .footer-whatsapp:hover {
        transform: none;
      }
    }

  </style>
</head>
<body>

<div class="layout">

  <div class="photo-col">
    <div class="photo">
      <!-- Foto real (foto.jpg ou foto.png na mesma pasta).
           Se não existir, faz fallback pras iniciais. -->
      <img src="./hero.png?v=2" alt="Gabriel"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
      <span class="initials" style="display:none;">GD</span>
    </div>
  </div>

  <div class="content-col">
<h1 class="greeting">Hi, I'm Gabriel.</h1>
    <p class="subtitle">Welcome to my profile.</p>

    <div class="links">
      <a href="https://x.com/gabbsweb3" target="_blank" rel="noopener" aria-label="Twitter / X">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-7.3L6.4 22H3.3l7.3-8.4L2.8 2h6.4l4.4 6.6L18.9 2Zm-1.1 17.9h1.7L8.2 4H6.4l11.4 15.9Z"/>
        </svg>
        <span>Twitter</span>
      </a>

      <a href="https://linkedin.com/in/gabbswq" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.98 3.5C4.98 4.88 3.86 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5ZM.3 8.1h4.4V23H.3V8.1Zm7.2 0h4.2v2h.1c.6-1.1 2-2.3 4.2-2.3 4.5 0 5.3 2.9 5.3 6.7V23h-4.4v-7.5c0-1.8 0-4.1-2.5-4.1s-2.9 2-2.9 4V23H7.5V8.1Z"/>
        </svg>
        <span>LinkedIn</span>
      </a>

      <a href="mailto:gabbsdiniz@proton.me" aria-label="Proton Mail">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-13Zm2.1.7v11.3L9.7 12 5.1 6.2Zm13.8 0L14.3 12l4.6 5.5V6.2ZM6.4 5l5.6 6.5L17.6 5H6.4Zm5.6 9.2-5.2 5.6h10.4L12 14.2Z"/>

    </div>

    <div class="signup">
      <form id="contact-form" autocomplete="on">
        <input
          type="email"
          name="email"
          id="email-input"
          placeholder="Type your e-mail"
          aria-label="Your e-mail"
          required
        />
        <button type="submit" aria-label="Send">→</button>
      </form>
      <p class="note">Opens your e-mail app with a ready-to-send message.</p>
    </div>

    <footer>
      <div>© 2026 · <a href="https://github.com/gabbswq">@gabbswq</a></div>

      <a class="footer-whatsapp" href="https://wa.me/5542988365669" target="_blank" rel="noopener" aria-label="Contact on WhatsApp">
        <span>Contact</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.5 0 .2 5.3.2 11.8c0 2.1.6 4.1 1.6 5.9L0 24l6.5-1.7a12 12 0 0 0 5.7 1.4h.1c6.5 0 11.8-5.3 11.8-11.8a11.7 11.7 0 0 0-3.6-8.4ZM12.2 21.7a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.9 1 1-3.8-.2-.4a9.7 9.7 0 0 1-1.5-5.1c0-5.4 4.4-9.8 9.8-9.8 2.6 0 5.1 1 6.9 2.9a9.7 9.7 0 0 1 2.9 6.9c.1 5.5-4.3 9.9-9.6 9.9Zm5.4-7.3c-.3-.1-1.7-.9-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-1 1.1-.2.2-.4.2-.7.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.4.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.7-1-2.3c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1 0-.3-.1-.6-.2Z"/>
        </svg>
      </a>
    </footer>

  </div>

</div>

<script>
  document.getElementById('contact-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const visitorEmail = document.getElementById('email-input').value;
    const subject = encodeURIComponent('Hi Gabriel — from your site');
    const body = encodeURIComponent(
      'Hi Gabriel,\n\nI came from gabbswq.github.io. My e-mail: ' + visitorEmail + '\n\n— '
    );
    window.location.href = 'mailto:gabbsdiniz@proton.me?subject=' + subject + '&body=' + body;
  });
</script>

</body>
</html>
