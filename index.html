<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabriel</title>
  <meta name="description" content="Gabriel · Brazil." />

  <meta property="og:title" content="Gabriel" />
  <meta property="og:description" content="Brazil." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://gabbswq.github.io" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0a0a;
      --border: #222;
      --border-strong: #2e2e2e;
      --text: #ededed;
      --text-soft: #888;
      --text-muted: #555;
      --accent: #f7931a;
      --radius: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    a { color: var(--text); text-decoration: none; transition: color 0.15s; }
    a:hover { color: var(--accent); }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      max-width: 1120px;
      width: 100%;
      align-items: center;
    }
    @media (min-width: 768px) {
      .layout {
        grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.9fr);
        gap: 4.5rem;
      }
    }

    /* ===== Photo ===== */
    .photo-col { width: 100%; }
    .photo {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
    }

    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 70% 35%, transparent 0%, rgba(0,0,0,0.18) 48%, rgba(0,0,0,0.45) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.04), rgba(0,0,0,0.26));
      pointer-events: none;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 56% center;
      border-radius: var(--radius);
      display: block;
      filter: brightness(0.88) contrast(1.06);
    }
    .photo .initials {
      font-family: 'Manrope', sans-serif;
      font-size: 7rem;
      font-weight: 700;
      color: var(--accent);
      opacity: 0.35;
      letter-spacing: -0.05em;
    }

    /* ===== Right column ===== */
    .content-col {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

.greeting {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      font-weight: 800;
      font-size: 2.75rem;
      line-height: 1.05;
      color: var(--text);
      letter-spacing: -0.045em;
      margin-bottom: -0.5rem;
    }

    .subtitle {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      font-weight: 500;
      font-size: 1.25rem;
      color: var(--text-soft);
      letter-spacing: -0.02em;
    }

    /* Inline social links */
    .links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      font-size: 0.95rem;
      padding-top: 1.25rem;
      padding-bottom: 1.25rem;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .links a {
      color: var(--text);
      transition: color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .links a:hover { color: var(--accent); }
.links a .platform-icon {
      font-size: 0.95rem;
      opacity: 0.7;
    }

    /* Form */
    .signup form {
      display: flex;
      gap: 0.5rem;
    }
    .signup input[type="email"] {
      flex: 1;
      padding: 0.85rem 1rem;
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .signup input[type="email"]:focus { border-color: var(--accent); }
    .signup button {
      width: 48px;
      height: 48px;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .signup button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }
    .signup .note {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.6rem;
    }

    footer {
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    footer a { color: var(--text-muted); text-decoration: underline; text-decoration-color: var(--text-muted); }
    footer a:hover { color: var(--accent); text-decoration-color: var(--accent); }

    .footer-contact {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .footer-contact span {
      color: var(--text-muted);
    }


    /* ===== GSAP-inspired portfolio motion ===== */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 32% 45%, rgba(247, 147, 26, 0.08), transparent 28%),
        radial-gradient(circle at 72% 40%, rgba(255, 255, 255, 0.035), transparent 26%);
      opacity: 0.7;
      z-index: -1;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle at center, black, transparent 72%);
      opacity: 0.18;
      z-index: -1;
    }

    .photo {
      isolation: isolate;
      transform-style: preserve-3d;
      transition:
        border-color 0.35s ease,
        box-shadow 0.35s ease;
    }

    .photo::before {
      content: "";
      position: absolute;
      inset: -1px;
      background: linear-gradient(120deg, transparent, rgba(247,147,26,0.45), transparent);
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: 2;
      pointer-events: none;
    }

    .photo:hover {
      border-color: rgba(247, 147, 26, 0.28);
      box-shadow:
        0 40px 120px rgba(0, 0, 0, 0.72),
        0 0 0 1px rgba(247,147,26,0.08),
        0 0 48px rgba(247,147,26,0.08);
    }

    .photo:hover::before {
      opacity: 0.18;
    }

    .photo img {
      transition: filter 0.35s ease;
      will-change: transform, filter;
    }

    .photo:hover img {
      filter: brightness(0.98) contrast(1.13);
    }

    .greeting {
      overflow: hidden;
    }

    .greeting span {
      display: inline-block;
      will-change: transform, opacity;
    }

    .subtitle,
    .links,
    .signup,
    footer {
      will-change: transform, opacity;
    }

    .links {
      gap: 0.7rem;
    }

    .links a {
      position: relative;
      padding: 0.55rem 0.75rem;
      border: 1px solid transparent;
      border-radius: 999px;
      overflow: hidden;
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
    }

    .links a::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(247,147,26,0.12), transparent);
      transform: translateX(-120%);
      transition: transform 0.55s ease;
    }

    .links a:hover::before {
      transform: translateX(120%);
    }

    .links a:hover {
      color: var(--text);
      transform: translateY(-2px);
      border-color: rgba(247, 147, 26, 0.32);
      background: rgba(247, 147, 26, 0.075);
    }

    .social-icon {
      width: 1rem;
      height: 1rem;
      fill: currentColor;
      color: var(--text);
      display: block;
      position: relative;
      z-index: 1;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .social-glyph {
      position: relative;
      z-index: 1;
      font-size: 1rem;
      line-height: 1;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .links a span:not(.social-glyph),
    .links a svg {
      position: relative;
      z-index: 1;
    }

    .links a:hover .social-icon,
    .links a:hover .social-glyph {
      color: var(--accent);
      transform: scale(1.08) rotate(-3deg);
    }

    .signup input[type="email"] {
      transition:
        border-color 0.22s ease,
        background 0.22s ease,
        box-shadow 0.22s ease;
    }

    .signup input[type="email"]:hover {
      border-color: rgba(247, 147, 26, 0.38);
      background: rgba(255, 255, 255, 0.018);
    }

    .signup input[type="email"]:focus {
      border-color: rgba(247, 147, 26, 0.9);
      box-shadow:
        0 0 0 4px rgba(247, 147, 26, 0.08),
        0 0 34px rgba(247, 147, 26, 0.12);
      background: rgba(255, 255, 255, 0.025);
    }

    .signup button {
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .signup button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(247, 147, 26, 0.2);
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.3rem 0.55rem;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
    }

    .contact-link span {
      color: var(--text-soft);
      transition: color 0.2s ease;
    }

    .contact-link:hover {
      transform: translateY(-1px);
      color: var(--accent);
      border-color: rgba(247, 147, 26, 0.32);
      background: rgba(247, 147, 26, 0.07);
    }

    .contact-link:hover span {
      color: var(--accent);
    }

    @media (prefers-reduced-motion: reduce) {
      .photo,
      .photo img,
      .links a,
      .links a::before,
      .social-icon,
      .social-glyph,
      .signup input[type="email"],
      .signup button,
      .contact-link {
        transition: none;
      }
    }

  </style>
</head>
<body>

<div class="layout">

  <div class="photo-col">
    <div class="photo">
      <!-- Foto real (foto.jpg ou foto.png na mesma pasta).
           Se não existir, faz fallback pras iniciais. -->
      <img src="./hero.png?v=2" alt="Gabriel"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
      <span class="initials" style="display:none;">GD</span>
    </div>
  </div>

  <div class="content-col">
<h1 class="greeting"><span>Hi,</span> <span>I\'m</span> <span>Gabriel.</span></h1>
    <p class="subtitle">Welcome to my profile.</p>

    <div class="links">
      <a href="https://x.com/gabbsweb3" target="_blank" rel="noopener" aria-label="Twitter / X">
        <span class="social-glyph">𝕏</span>
        <span>Twitter</span>
      </a>

      <a href="https://linkedin.com/in/gabbswq" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.98 3.5C4.98 4.88 3.86 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5ZM.3 8.1h4.4V23H.3V8.1Zm7.2 0h4.2v2h.1c.6-1.1 2-2.3 4.2-2.3 4.5 0 5.3 2.9 5.3 6.7V23h-4.4v-7.5c0-1.8 0-4.1-2.5-4.1s-2.9 2-2.9 4V23H7.5V8.1Z"/>
        </svg>
        <span>LinkedIn</span>
      </a>

      <a href="mailto:gabbsdiniz@proton.me" aria-label="Email">
        <span class="social-glyph">✉</span>
        <span>Email</span>
      </a>
    </div>

    <div class="signup">
      <form id="contact-form" autocomplete="on">
        <input
          type="email"
          name="email"
          id="email-input"
          placeholder="Type your e-mail"
          aria-label="Your e-mail"
          required
        />
        <button type="submit" aria-label="Send">→</button>
      </form>
      <p class="note">Opens your e-mail app with a ready-to-send message.</p>
    </div>

    <footer>
      <div>© 2026 · <a href="https://github.com/gabbswq">@gabbswq</a></div>

      <a class="contact-link" href="https://wa.me/5542988365669" target="_blank" rel="noopener">
        Contact <span>WhatsApp</span> ↗
      </a>
    </footer>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>

  if (window.gsap) {
    gsap.set([".photo-col", ".content-col"], { opacity: 0, y: 26, filter: "blur(10px)" });
    gsap.set(".greeting span", { opacity: 0, y: 48, rotateX: 55 });
    gsap.set([".subtitle", ".links", ".signup", "footer"], { opacity: 0, y: 18 });

    const tl = gsap.timeline({ defaults: { ease: "power4.out" } });

    tl.to(".photo-col", {
      opacity: 1,
      y: 0,
      filter: "blur(0px)",
      duration: 1.05
    })
    .to(".content-col", {
      opacity: 1,
      y: 0,
      filter: "blur(0px)",
      duration: 0.9
    }, "-=0.72")
    .to(".greeting span", {
      opacity: 1,
      y: 0,
      rotateX: 0,
      stagger: 0.08,
      duration: 0.85
    }, "-=0.55")
    .to([".subtitle", ".links", ".signup", "footer"], {
      opacity: 1,
      y: 0,
      stagger: 0.08,
      duration: 0.65
    }, "-=0.45");

    const photo = document.querySelector(".photo");
    if (photo) {
      photo.addEventListener("mousemove", (e) => {
        const rect = photo.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;

        gsap.to(photo, {
          rotateY: x * 5,
          rotateX: -y * 5,
          y: -6,
          scale: 1.012,
          duration: 0.45,
          ease: "power3.out"
        });

        gsap.to(".photo img", {
          x: x * 12,
          y: y * 12,
          scale: 1.04,
          duration: 0.55,
          ease: "power3.out"
        });
      });

      photo.addEventListener("mouseleave", () => {
        gsap.to(photo, {
          rotateY: 0,
          rotateX: 0,
          y: 0,
          scale: 1,
          duration: 0.65,
          ease: "elastic.out(1, 0.55)"
        });

        gsap.to(".photo img", {
          x: 0,
          y: 0,
          scale: 1,
          duration: 0.65,
          ease: "power3.out"
        });
      });
    }
  }

  document.getElementById('contact-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const visitorEmail = document.getElementById('email-input').value;
    const subject = encodeURIComponent('Hi Gabriel — from your site');
    const body = encodeURIComponent(
      'Hi Gabriel,\n\nI came from gabbswq.github.io. My e-mail: ' + visitorEmail + '\n\n— '
    );
    window.location.href = 'mailto:gabbsdiniz@proton.me?subject=' + subject + '&body=' + body;
  });
</script>

</body>
</html>
