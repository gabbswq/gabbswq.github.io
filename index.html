<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gabriel</title>
  <meta name="description" content="Gabriel · Personal portfolio." />

  <meta property="og:title" content="Gabriel" />
  <meta property="og:description" content="Personal portfolio." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://gabbswq.github.io" />
  <meta property="og:image" content="https://gabbswq.github.io/hero.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #050505;
      --text: #ededed;
      --text-soft: #9b9b9b;
      --text-muted: #5f5f5f;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #f7931a;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 28% 45%, rgba(247,147,26,0.06), transparent 30%),
        radial-gradient(circle at 78% 48%, rgba(130,90,255,0.05), transparent 34%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 72px 72px;
      opacity: 0.14;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      position: relative;
      z-index: 2;
    }

    .hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
    }

    .layout {
      width: 100%;
      max-width: 1160px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      align-items: center;
    }

    @media (min-width: 860px) {
      .layout {
        grid-template-columns: minmax(0, 1.25fr) minmax(360px, 0.9fr);
        gap: 4.5rem;
      }
    }

    .photo-col {
      perspective: 1200px;
    }

    .photo {
      width: 100%;
      aspect-ratio: 16 / 10;
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: rgba(10, 10, 10, 0.55);
      box-shadow:
        0 34px 110px rgba(0, 0, 0, 0.62),
        0 0 0 1px rgba(247, 147, 26, 0.035);
      transform-style: preserve-3d;
      will-change: transform;
      transition: border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .photo::before {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(120deg, transparent, rgba(247,147,26,0.34), transparent);
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        radial-gradient(circle at 70% 36%, transparent 0%, rgba(0,0,0,0.2) 52%, rgba(0,0,0,0.55) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.04), rgba(0,0,0,0.32));
    }

    .photo:hover {
      border-color: rgba(247, 147, 26, 0.28);
      box-shadow:
        0 42px 130px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(247, 147, 26, 0.08),
        0 0 46px rgba(247, 147, 26, 0.08);
    }

    .photo:hover::before {
      opacity: 0.16;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 58% center;
      display: block;
      filter: brightness(0.9) contrast(1.08);
      transition: filter 0.35s ease;
      will-change: transform, filter;
    }

    .photo:hover img {
      filter: brightness(0.98) contrast(1.13);
    }

    .content-col {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .greeting {
      max-width: 640px;
      font-family: Manrope, Inter, sans-serif;
      font-size: clamp(2.55rem, 4.8vw, 4.65rem);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.065em;
      color: var(--text);
      overflow: visible;
      padding-bottom: 0.08em;
    }

    .greeting span {
      display: inline-block;
      padding-bottom: 0.04em;
      will-change: transform, opacity;
    }

    .profile-line {
      max-width: 500px;
      margin-top: -0.2rem;
      font-family: Manrope, Inter, sans-serif;
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-soft);
      letter-spacing: -0.02em;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      padding: 1.2rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .social-link {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.58rem 0.82rem;
      border: 1px solid transparent;
      border-radius: 999px;
      overflow: hidden;
      color: var(--text);
      transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease;
    }

    .social-link::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, transparent, rgba(247,147,26,0.14), transparent);
      transform: translateX(-120%);
      transition: transform 0.55s ease;
    }

    .social-link:hover::before {
      transform: translateX(120%);
    }

    .social-link:hover {
      transform: translateY(-2px);
      border-color: rgba(247, 147, 26, 0.34);
      background: rgba(247, 147, 26, 0.065);
    }

    .social-mark,
    .proton-icon {
      width: 1.15rem;
      height: 1.15rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: color 0.22s ease, transform 0.22s ease;
    }

    .social-mark {
      font-family: Manrope, Inter, sans-serif;
      font-size: 0.88rem;
      font-weight: 800;
      line-height: 1;
    }

    .linkedin-mark {
      font-size: 0.82rem;
      letter-spacing: -0.08em;
      text-transform: lowercase;
    }

    .proton-icon {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .proton-icon path:first-child {
      fill: rgba(255, 255, 255, 0.035);
    }

    .social-link:hover .social-mark,
    .social-link:hover .proton-icon {
      color: var(--accent);
      transform: scale(1.1) rotate(-4deg);
    }

    .signup form {
      display: flex;
      gap: 0.55rem;
    }

    .signup input {
      flex: 1;
      min-width: 0;
      padding: 0.9rem 1rem;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
    }

    .signup input::placeholder {
      color: var(--text-soft);
    }

    .signup input:hover {
      border-color: rgba(247, 147, 26, 0.38);
      background: rgba(255, 255, 255, 0.018);
    }

    .signup input:focus {
      border-color: rgba(247, 147, 26, 0.9);
      box-shadow:
        0 0 0 4px rgba(247, 147, 26, 0.08),
        0 0 34px rgba(247, 147, 26, 0.12);
      background: rgba(255, 255, 255, 0.025);
    }

    .signup button {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease, color 0.22s ease, border-color 0.22s ease;
    }

    .signup button:hover {
      transform: translateY(-2px);
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      box-shadow: 0 16px 40px rgba(247, 147, 26, 0.2);
    }

    .note {
      margin-top: 0.62rem;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    footer {
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: underline;
      text-decoration-color: rgba(255,255,255,0.18);
      transition: color 0.18s ease, text-decoration-color 0.18s ease;
    }

    footer a:hover {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      padding: 0.42rem 0.72rem;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      color: var(--text-muted);
      text-decoration: none;
      overflow: hidden;
      transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
    }

    .contact-dot {
      width: 0.38rem;
      height: 0.38rem;
      border-radius: 999px;
      background: var(--accent);
      opacity: 0.75;
      box-shadow: 0 0 16px rgba(247,147,26,0.35);
      transition: width 0.24s ease, opacity 0.24s ease, transform 0.24s ease;
    }

    .contact-main {
      color: var(--text-soft);
      transition: color 0.22s ease;
    }

    .contact-arrow {
      color: var(--text-muted);
      transition: color 0.22s ease, transform 0.22s ease;
    }

    .contact-link:hover {
      transform: translateY(-2px);
      border-color: rgba(247,147,26,0.35);
      background: rgba(247,147,26,0.07);
      box-shadow: 0 14px 34px rgba(247,147,26,0.08);
    }

    .contact-link:hover .contact-dot {
      width: 1.05rem;
      opacity: 1;
      transform: translateX(0.1rem);
    }

    .contact-link:hover .contact-main,
    .contact-link:hover .contact-arrow {
      color: var(--accent);
    }

    .contact-link:hover .contact-arrow {
      transform: translateX(0.18rem);
    }

    @media (max-width: 859px) {
      .hero {
        padding: 2rem 1rem;
      }

      .layout {
        gap: 2rem;
      }

      .photo {
        aspect-ratio: 16 / 11;
      }

      .greeting {
      max-width: 640px;
      font-family: Manrope, Inter, sans-serif;
      font-size: clamp(2.55rem, 4.8vw, 4.65rem);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.065em;
      color: var(--text);
      overflow: visible;
      padding-bottom: 0.08em;
    }

      .social-link {
        padding: 0.52rem 0.68rem;
      }

      .end-scene {
        padding: 0 1rem 2rem;
      }
    }

    /* ===== FINAL FIX: background, proton, whatsapp ===== */
    .ambient-visual {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(5,5,5,0.98) 0%, rgba(5,5,5,0.88) 40%, rgba(5,5,5,0.74) 68%, rgba(5,5,5,0.86) 100%),
        linear-gradient(to bottom, rgba(5,5,5,0.7), rgba(5,5,5,0.92)),
        url("./hero-bg-final.png?v=15");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center right;
      opacity: 0.64;
      filter: brightness(0.82) contrast(1.12) saturate(0.92);
      transform: scale(1.02);
    }

    .ambient-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 72% 62%, rgba(247,147,26,0.16), transparent 28%),
        radial-gradient(circle at 82% 40%, rgba(130,90,255,0.11), transparent 30%),
        radial-gradient(circle at 35% 50%, transparent 0%, rgba(5,5,5,0.82) 72%);
      opacity: 0.8;
    }

    .page {
      position: relative;
      z-index: 2;
    }


    .footer-contact {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
    }

    .footer-contact > span {
      color: var(--text-muted);
    }

    .whatsapp-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      color: var(--text-soft);
      text-decoration: none;
      transition:
        color 0.22s ease,
        transform 0.22s ease;
    }

    .whatsapp-link::after {
      content: "";
      position: absolute;
      left: 1rem;
      right: 0;
      bottom: -0.18rem;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      opacity: 0.75;
      transition: transform 0.25s ease;
    }

    .wa-dot {
      width: 0.36rem;
      height: 0.36rem;
      border-radius: 999px;
      background: var(--accent);
      opacity: 0.75;
      box-shadow: 0 0 14px rgba(247,147,26,0.38);
      animation: waPulse 2.4s ease-in-out infinite;
    }

    .whatsapp-link:hover {
      color: var(--accent);
      transform: translateY(-1px);
    }

    .whatsapp-link:hover::after {
      transform: scaleX(1);
    }

    @keyframes waPulse {
      0%, 100% {
        opacity: 0.45;
        transform: scale(0.82);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 859px) {
      .ambient-visual::before {
        background-position: 68% bottom;
        opacity: 0.48;
      }
    }


    /* ===== OVERLAY BACKGROUND FINAL ===== */
    .ambient-visual {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      background: #050505;
    }

    .ambient-visual img {
      position: absolute;
      right: -4vw;
      bottom: -8vh;
      width: min(92vw, 1500px);
      height: auto;
      opacity: 0.56;
      object-fit: contain;
      object-position: right bottom;
      mix-blend-mode: screen;
      filter:
        brightness(0.72)
        contrast(1.22)
        saturate(1.08)
        blur(0px);
      mask-image: radial-gradient(
        ellipse at 72% 68%,
        black 0%,
        black 28%,
        rgba(0,0,0,0.72) 45%,
        transparent 78%
      );
      -webkit-mask-image: radial-gradient(
        ellipse at 72% 68%,
        black 0%,
        black 28%,
        rgba(0,0,0,0.72) 45%,
        transparent 78%
      );
      transform: scale(1.05);
    }

    .ambient-visual::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(circle at 78% 72%, rgba(247,147,26,0.15), transparent 30%),
        radial-gradient(circle at 82% 58%, rgba(125,80,255,0.12), transparent 34%),
        linear-gradient(90deg, #050505 0%, rgba(5,5,5,0.92) 42%, rgba(5,5,5,0.58) 72%, rgba(5,5,5,0.82) 100%),
        linear-gradient(to bottom, rgba(5,5,5,0.68), rgba(5,5,5,0.94));
    }

    .ambient-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      background-image:
        linear-gradient(rgba(255,255,255,0.014) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
      background-size: 72px 72px;
      opacity: 0.16;
      mask-image: radial-gradient(circle at center, black, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at center, black, transparent 75%);
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
    }

    .hero {
      min-height: 100vh;
    }

    .end-scene {
      display: none !important;
    }

    @media (max-width: 859px) {
      .ambient-visual img {
        right: -28vw;
        bottom: -4vh;
        width: 150vw;
        opacity: 0.38;
      }
    }


    /* ===== PROTON FINAL ICON FIX ===== */
    .proton-logo {
      width: 1.08rem;
      height: 1.08rem;
      flex: 0 0 1.08rem;
      display: block;
      color: var(--text);
      fill: currentColor;
      opacity: 0.95;
      transition:
        color 0.22s ease,
        transform 0.22s ease,
        opacity 0.22s ease;
    }

    .social-link:hover .proton-logo {
      color: var(--accent);
      opacity: 1;
      transform: scale(1.08) rotate(-4deg);
    }


    /* ===== REMOVE ICONS FINAL ===== */
    .links {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1.35rem;
    }

    .text-only-link {
      min-height: auto;
      padding: 0.35rem 0;
      border: none;
      border-radius: 0;
      background: transparent;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .text-only-link::before {
      display: none;
    }

    .text-only-link:hover {
      transform: translateY(-1px);
      border: none;
      background: transparent;
      color: var(--accent);
    }

    .footer-contact {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .footer-contact span {
      color: var(--text-muted);
    }

    .whatsapp-link {
      color: var(--text-soft);
      text-decoration: none;
      transition: color 0.22s ease, transform 0.22s ease;
    }

    .whatsapp-link::after {
      display: none;
    }

    .whatsapp-link:hover {
      color: var(--accent);
      transform: translateY(-1px);
    }


    /* ===== CENTER SOCIAL LINKS AND WHATSAPP ICON ===== */
    .profile-line {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
    }

    .links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.65rem;
      width: 100%;
      text-align: center;
    }

    .text-only-link {
      min-height: auto;
      padding: 0.38rem 0;
      border: none;
      border-radius: 0;
      background: transparent;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1;
    }

    .text-only-link::before {
      display: none;
    }

    .text-only-link:hover {
      transform: translateY(-1px);
      border: none;
      background: transparent;
      color: var(--accent);
    }

    .footer-contact {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
    }

    .footer-contact > span {
      color: var(--text-muted);
    }

    .whatsapp-link {
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      color: var(--text-soft);
      text-decoration: none;
      transition:
        color 0.22s ease,
        transform 0.22s ease;
    }

    .whatsapp-link::after {
      display: none;
    }

    .whatsapp-icon {
      width: 0.95rem;
      height: 0.95rem;
      display: block;
      fill: currentColor;
      opacity: 0.9;
      transition:
        color 0.22s ease,
        transform 0.22s ease,
        opacity 0.22s ease;
    }

    .whatsapp-link:hover {
      color: var(--accent);
      transform: translateY(-1px);
    }

    .whatsapp-link:hover .whatsapp-icon {
      opacity: 1;
      transform: scale(1.08) rotate(-4deg);
    }

  </style>
</head>

<body>
  <div class="ambient-visual" aria-hidden="true"><img src="./hero-bg-final.png?v=16" alt=""></div>
<main class="page">
    <section class="hero">
      <div class="layout">
        <div class="photo-col">
          <div class="photo">
            <img src="./hero.png?v=13" alt="Gabriel working on a laptop" />
          </div>
        </div>

        <div class="content-col">
          <h1 class="greeting">
            <span>Welcome</span> <span>to</span> <span>my</span> <span>profile.</span>
          </h1>

          <p class="profile-line">Se você não constrói seu sonho alguém vai te contratar para construir o dele!</p>

          <div class="links">
            <a class="social-link text-only-link" href="https://x.com/gabbsweb3" target="_blank" rel="noopener">Twitter</a>
            <a class="social-link text-only-link" href="https://linkedin.com/in/gabbswq" target="_blank" rel="noopener">LinkedIn</a>
            <a class="social-link text-only-link" href="mailto:gabbsdiniz@proton.me">Proton</a>
          </div>

          <div class="signup">
            <form id="contact-form">
              <input id="email-input" type="email" placeholder="Type your e-mail" required />
              <button type="submit">→</button>
            </form>
            <p class="note">Vamos construir algo juntos.</p>
          </div>

          <footer>
            <div>© 2026 · <a href="https://github.com/gabbswq">@gabbswq</a></div>

            <div class="footer-contact">

  <script>
    const form = document.getElementById("contact-form");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const visitorEmail = document.getElementById("email-input").value;
      const subject = encodeURIComponent("Hi Gabriel — from your site");
      const body = encodeURIComponent(`Hi Gabriel,

I came from gabbswq.github.io. My e-mail: ${visitorEmail}

—`);

      window.location.href = `mailto:gabbsdiniz@proton.me?subject=${subject}&body=${body}`;
    });

    if (window.gsap) {
      gsap.set([".photo-col", ".content-col"], {
        opacity: 0,
        y: 26,
        filter: "blur(10px)"
      });

      gsap.set(".greeting span", {
        opacity: 0,
        y: 48,
        rotateX: 55
      });

      gsap.set([".profile-line", ".links", ".signup", "footer"], {
        opacity: 0,
        y: 18
      });

      const tl = gsap.timeline({ defaults: { ease: "power4.out" } });

      tl.to(".photo-col", {
        opacity: 1,
        y: 0,
        filter: "blur(0px)",
        duration: 1.05
      })
      .to(".content-col", {
        opacity: 1,
        y: 0,
        filter: "blur(0px)",
        duration: 0.9
      }, "-=0.72")
      .to(".greeting span", {
        opacity: 1,
        y: 0,
        rotateX: 0,
        stagger: 0.08,
        duration: 0.85
      }, "-=0.55")
      .to([".profile-line", ".links", ".signup", "footer"], {
        opacity: 1,
        y: 0,
        stagger: 0.08,
        duration: 0.65
      }, "-=0.45");

      const photo = document.querySelector(".photo");

      photo.addEventListener("mousemove", function (e) {
        const rect = photo.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;

        gsap.to(photo, {
          rotateY: x * 5,
          rotateX: -y * 5,
          y: -6,
          scale: 1.012,
          duration: 0.45,
          ease: "power3.out"
        });

        gsap.to(".photo img", {
          x: x * 12,
          y: y * 12,
          scale: 1.04,
          duration: 0.55,
          ease: "power3.out"
        });
      });

      photo.addEventListener("mouseleave", function () {
        gsap.to(photo, {
          rotateY: 0,
          rotateX: 0,
          y: 0,
          scale: 1,
          duration: 0.65,
          ease: "elastic.out(1, 0.55)"
        });

        gsap.to(".photo img", {
          x: 0,
          y: 0,
          scale: 1,
          duration: 0.65,
          ease: "power3.out"
        });
      });
    }
  </script>
