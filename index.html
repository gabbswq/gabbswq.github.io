<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabriel</title>
  <meta name="description" content="Gabriel · Brazil." />

  <meta property="og:title" content="Gabriel" />
  <meta property="og:description" content="Brazil." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://gabbswq.github.io" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0a0a;
      --border: #222;
      --border-strong: #2e2e2e;
      --text: #ededed;
      --text-soft: #888;
      --text-muted: #555;
      --accent: #f7931a;
      --radius: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    a { color: var(--text); text-decoration: none; transition: color 0.15s; }
    a:hover { color: var(--accent); }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      max-width: 980px;
      width: 100%;
      align-items: center;
    }
    @media (min-width: 768px) {
      .layout { grid-template-columns: 1fr 1.1fr; gap: 4rem; }
    }

    /* ===== Photo ===== */
    .photo-col { width: 100%; }
    .photo {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--radius);
      display: block;
    }
    .photo .initials {
      font-family: 'Manrope', sans-serif;
      font-size: 7rem;
      font-weight: 700;
      color: var(--accent);
      opacity: 0.35;
      letter-spacing: -0.05em;
    }

    /* ===== Right column ===== */
    .content-col {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Marker "Portfolio" */
    .portfolio-marker {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      border: 1px solid var(--border-strong);
      border-radius: 100px;
      font-family: 'Manrope', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-soft);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      align-self: flex-start;
    }
    .portfolio-marker .icon {
      color: var(--accent);
      font-size: 0.9rem;
    }

    .greeting {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      font-weight: 800;
      font-size: 2.75rem;
      line-height: 1.05;
      color: var(--text);
      letter-spacing: -0.045em;
      margin-bottom: -0.5rem;
    }

    .subtitle {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      font-weight: 500;
      font-size: 1.25rem;
      color: var(--text-soft);
      letter-spacing: -0.02em;
    }

    /* Inline social links */
    .links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      font-size: 0.95rem;
      padding-top: 1.25rem;
      padding-bottom: 1.25rem;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .links a {
      color: var(--text);
      transition: color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .links a:hover { color: var(--accent); }
    .links a .platform-icon {
      font-size: 0.95rem;
      opacity: 0.7;
    }

    /* Form */
    .signup form {
      display: flex;
      gap: 0.5rem;
    }
    .signup input[type="email"] {
      flex: 1;
      padding: 0.85rem 1rem;
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .signup input[type="email"]:focus { border-color: var(--accent); }
    .signup button {
      width: 48px;
      height: 48px;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .signup button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }
    .signup .note {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.6rem;
    }

    footer {
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    footer a { color: var(--text-muted); text-decoration: underline; text-decoration-color: var(--text-muted); }
    footer a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  </style>
</head>
<body>

<div class="layout">

  <div class="photo-col">
    <div class="photo">
      <!-- Foto real (foto.jpg ou foto.png na mesma pasta).
           Se não existir, faz fallback pras iniciais. -->
      <img src="foto.jpg" alt="Gabriel"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
      <span class="initials" style="display:none;">GD</span>
    </div>
  </div>

  <div class="content-col">

    <span class="portfolio-marker">
      <span class="icon">◆</span>
      Portfolio
    </span>

    <h1 class="greeting">Hi, I'm Gabriel.</h1>
    <p class="subtitle">Welcome to my profile.</p>

    <div class="links">
      <a href="https://x.com/gabbsweb3" target="_blank" rel="noopener">𝕏 &nbsp;Twitter</a>
      <a href="https://linkedin.com/in/gabbswq" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:gabbsdiniz@proton.me">Email</a>
      <!-- WhatsApp: troque 55XXXXXXXXXXX pelo seu número (DDI 55 + DDD + número, sem espaço/+) -->
      <a href="https://wa.me/5542988365669" target="_blank" rel="noopener">WhatsApp</a>
    </div>

    <div class="signup">
      <form id="contact-form" autocomplete="on">
        <input
          type="email"
          name="email"
          id="email-input"
          placeholder="Type your e-mail"
          aria-label="Your e-mail"
          required
        />
        <button type="submit" aria-label="Send">→</button>
      </form>
      <p class="note">Opens your e-mail app with a ready-to-send message.</p>
    </div>

    <footer>
      <div>© 2026 · <a href="https://github.com/gabbswq">@gabbswq</a></div>
    </footer>

  </div>

</div>

<script>
  document.getElementById('contact-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const visitorEmail = document.getElementById('email-input').value;
    const subject = encodeURIComponent('Hi Gabriel — from your site');
    const body = encodeURIComponent(
      'Hi Gabriel,\n\nI came from gabbswq.github.io. My e-mail: ' + visitorEmail + '\n\n— '
    );
    window.location.href = 'mailto:gabbsdiniz@proton.me?subject=' + subject + '&body=' + body;
  });
</script>

</body>
</html>
